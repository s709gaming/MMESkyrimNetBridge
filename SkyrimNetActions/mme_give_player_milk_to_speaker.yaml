name: GivePlayerMilkToSpeaker
label: Give milk to speaker
description: "The player gives the speaking adult NPC one supported milk item from the player's inventory, and the NPC immediately drinks it. This action performs the transfer and consumption itself without opening a dialogue menu. Use it only when the speaker agrees to or asks for the milk. It supports eligible adult men, women, and MME Milk Maids. Lactacid is never used. Do not narrate a second transfer and do not call this action repeatedly."
questEditorId: MMEAlertDebugQuest
scriptName: MMEAlertsController
executionFunctionName: GivePlayerMilkToSpeaker
defaultPriority: 8
parameterMapping:
  - type: speaker
    name: target
    description: the speaking adult NPC who receives and immediately drinks one milk item from the player's inventory
