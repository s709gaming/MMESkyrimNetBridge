name: SpeakerGivesMilkToActorToDrink
label: Speaker gives milk for another NPC to drink
description: "Use only when the speaking NPC gives milk to another nearby NPC, who immediately drinks it. This is a complete give-and-drink action, not an inventory gift: the selected receiver consumes the milk during the action. The player is never the receiver for this action; use SpeakerGivesMilkToPlayerToDrink instead. The speaker is never the receiver; use PlayerGivesMilkToSpeakerToDrink when the player is giving milk to the speaker. Do not reverse the participants, narrate a second transfer, or invoke another milk-drinking action."
questEditorId: MMEAlertDebugQuest
scriptName: MMEAlertsController
executionFunctionName: SpeakerGivesMilkToActorToDrink
defaultPriority: 8
parameterMapping:
  - type: speaker
    name: giver
    description: the speaking NPC who gives the milk and never drinks it in this action
  - type: dynamic
    name: drinker
    description: the selected nearby NPC who receives and immediately drinks the milk; never the player and never the speaking giver
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
