<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milk Maids</title>
<style>
:root{color-scheme:dark;font:18px/1.45 Arial,sans-serif;color:#f5eee3}*{box-sizing:border-box}body{margin:0;background:transparent;height:100vh;display:flex;align-items:center;justify-content:center}.panel{width:92vw;max-width:1080px;max-height:86vh;display:flex;flex-direction:column;background:#211e1bf5;border:1px solid #a38b67;border-radius:12px;box-shadow:0 18px 70px #0009;overflow:hidden}header{padding:25px 30px 20px;display:flex;gap:20px;align-items:center;justify-content:space-between;border-bottom:1px solid #665642}h1{font:32px Georgia,serif;margin:0;color:#f7dfb4}p{margin:6px 0;color:#c4b9a8;font-size:15px}.actions{display:flex;gap:10px}button{font:inherit;font-size:16px;padding:10px 17px;border:1px solid #a38b67;border-radius:5px;background:#43392c;color:#f5eee3;cursor:pointer}button:hover:not(:disabled),button:focus-visible{background:#60513b;outline:2px solid #e4c58f;outline-offset:2px}button:disabled{opacity:.45;cursor:default}.scroll{overflow:auto;min-height:160px}table{border-collapse:collapse;width:100%;text-align:left}th{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#cbb997;background:#2b2620;position:sticky;top:0}th,td{padding:16px 24px;border-bottom:1px solid #4b4033}td:first-child{font-weight:bold}td small{display:block;font-weight:normal;color:#b8ae9e;font-size:12px}td.amount{font-variant-numeric:tabular-nums;white-space:nowrap}.fullness{display:flex;align-items:center;gap:12px}.bar{width:110px;height:8px;border-radius:5px;background:#51483d;overflow:hidden}.fill{display:block;height:100%;background:#e1c694}.percent{min-width:62px;font-variant-numeric:tabular-nums}.empty{text-align:center;padding:42px 20px;color:#c4b9a8}footer{display:flex;justify-content:space-between;gap:12px;padding:15px 28px;color:#c4b9a8;font-size:13px;border-top:1px solid #665642}#notice{color:#efc99a}@media(max-width:760px){:root{font-size:15px}header{padding:18px;align-items:flex-start}th,td{padding:12px}.bar{width:55px}h1{font-size:26px}button{font-size:14px;padding:8px 12px}.panel{width:97vw}.fullness{gap:6px}}
</style></head><body><main class="panel" aria-labelledby="title"><header><div><h1 id="title">Milk Maids</h1><p>Milk reserves and fullness</p></div><div class="actions"><button id="refresh" disabled>Refresh</button><button id="close">Close</button></div></header><div class="scroll"><table><thead><tr><th>Milk Maid</th><th>Milk / Capacity</th><th>Fullness</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" role="status">Loading Milk Maids…</div></div><footer><span id="count">Waiting for roster</span><span id="notice" role="status">Milk Self is coming later.</span></footer></main>
<script>
(function(){
'use strict';
let session = '';
const rows=document.getElementById('rows'),empty=document.getElementById('empty'),count=document.getElementById('count'),notice=document.getElementById('notice'),refresh=document.getElementById('refresh');
function cell(tag,text){const node=document.createElement(tag);node.textContent=text;return node;}
function number(value){return typeof value==='number'&&Number.isFinite(value)?value:null;}
function formatted(value){return number(value)===null?'N/A':value.toFixed(1);}
function post(name){if(typeof window[name]!=='function'){notice.textContent='Controls are not ready yet.';return false;}try{window[name](session);return true;}catch(error){notice.textContent='Unable to reach the roster controls.';return false;}}
window.setRoster=function(payload){
 try {
  const data=typeof payload==='string'?JSON.parse(payload):payload;
  if(!data||!Array.isArray(data.rows)||typeof data.session!=='string')throw new Error('Invalid roster');
  session=data.session;rows.textContent='';
  data.rows.forEach(function(maid){
   const row=document.createElement('tr'),name=cell('td',typeof maid.name==='string'?maid.name:'Unnamed Milk Maid');
   if(maid.status)name.appendChild(cell('small',String(maid.status)));
   row.appendChild(name);const amount=cell('td',formatted(maid.milk)+' / '+formatted(maid.capacity));amount.className='amount';row.appendChild(amount);
   const fullness=document.createElement('td'),wrap=document.createElement('div');wrap.className='fullness';
   const percent=number(maid.percent);wrap.appendChild(cell('span',percent===null?'N/A':percent.toFixed(1)+'%'));wrap.firstChild.className='percent';
   const bar=document.createElement('div'),fill=document.createElement('span');bar.className='bar';fill.className='fill';fill.style.width=(percent===null?0:Math.max(0,Math.min(100,percent)))+'%';bar.setAttribute('aria-hidden','true');bar.appendChild(fill);wrap.appendChild(bar);fullness.appendChild(wrap);row.appendChild(fullness);
   const action=document.createElement('td'),button=cell('button','Milk Self');button.disabled=true;button.title='Not available in this version';action.appendChild(button);row.appendChild(action);rows.appendChild(row);
  });
  empty.hidden=data.rows.length>0;empty.textContent=data.message||'No registered Milk Maids.';count.textContent=data.rows.length+' Milk Maid'+(data.rows.length===1?'':'s');notice.textContent=data.message||'Milk Self is coming later.';refresh.disabled=false;
 }catch(error){notice.textContent='Unable to display the roster. Try Refresh.';refresh.disabled=false;if(typeof window.mmeRosterError==='function')window.mmeRosterError('invalid roster payload');}
};
refresh.addEventListener('click',function(){post('mmeRosterRefresh');});
document.getElementById('close').addEventListener('click',function(){post('mmeRosterClose');});
document.addEventListener('keydown',function(event){if(event.key==='Escape'&&post('mmeRosterClose')){event.preventDefault();}});
})();
</script></body></html>
