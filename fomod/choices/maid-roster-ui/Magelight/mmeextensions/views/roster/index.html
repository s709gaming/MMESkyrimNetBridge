<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milk Maids</title>
<style>
:root{color-scheme:dark;font:18px/1.45 Arial,sans-serif;color:#f5eee3}*{box-sizing:border-box}body{margin:0;background:transparent;height:100vh;display:flex;align-items:center;justify-content:center}.panel{width:92vw;max-width:1080px;max-height:86vh;display:flex;flex-direction:column;background:#211e1bf5;border:1px solid #a38b67;border-radius:12px;box-shadow:0 18px 70px #0009;overflow:hidden}header{padding:25px 30px 20px;display:flex;gap:20px;align-items:center;justify-content:space-between;border-bottom:1px solid #665642}h1{font:32px Georgia,serif;margin:0;color:#f7dfb4}p{margin:6px 0;color:#c4b9a8;font-size:15px}.actions{display:flex;gap:10px}button{font:inherit;font-size:16px;padding:10px 17px;border:1px solid #a38b67;border-radius:5px;background:#43392c;color:#f5eee3;cursor:pointer}button:hover:not(:disabled),button:focus-visible{background:#60513b;outline:2px solid #e4c58f;outline-offset:2px}button:disabled{opacity:.45;cursor:default}.scroll{overflow:auto;min-height:160px}table{border-collapse:collapse;width:100%;text-align:left}th{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#cbb997;background:#2b2620;position:sticky;top:0}th,td{padding:16px 24px;border-bottom:1px solid #4b4033}td:first-child{font-weight:bold}td small{display:block;font-weight:normal;color:#b8ae9e;font-size:12px}.milk-meter{width:230px;max-width:100%}.amount{text-align:right;font-size:14px;color:#ded5c5;font-variant-numeric:tabular-nums;white-space:nowrap;margin-bottom:6px}.fullness{display:flex;align-items:center;gap:12px}.bar{width:150px;flex:1;height:12px;border:1px solid #a38b67;border-radius:6px;background:#151310;overflow:hidden;box-shadow:inset 0 1px 3px #0009}.fill{display:block;height:100%;background:linear-gradient(#fffef8,#e6e1d5);border-radius:4px}.percent{min-width:62px;font-variant-numeric:tabular-nums}.empty{text-align:center;padding:42px 20px;color:#c4b9a8}footer{display:flex;justify-content:space-between;gap:12px;padding:15px 28px;color:#c4b9a8;font-size:13px;border-top:1px solid #665642}#notice{color:#efc99a}@media(max-width:760px){:root{font-size:15px}header{padding:18px;align-items:flex-start}th,td{padding:12px}.milk-meter{width:170px}.bar{width:70px}h1{font-size:26px}button{font-size:14px;padding:8px 12px}.panel{width:97vw}.fullness{gap:6px}}
.icon-button{font-family:"Segoe UI Emoji","Segoe UI Symbol",Arial,sans-serif;font-size:24px;line-height:1;width:48px;height:44px;padding:6px;flex-shrink:0}.action-slot{display:inline-flex;border-radius:5px}.action-slot:focus-visible{outline:2px solid #e4c58f;outline-offset:3px}.tooltip{position:fixed;z-index:100;bottom:3vh;left:50%;transform:translateX(-50%);width:460px;max-width:92vw;padding:12px 16px;border:1px solid #a38b67;border-radius:6px;background:#171410;color:#f5eee3;box-shadow:0 5px 24px #000b;font:15px/1.45 Arial,sans-serif;pointer-events:none}.tooltip[hidden]{display:none}@media(max-width:760px){.icon-button{width:40px;height:40px;font-size:22px}.actions{gap:6px}}
.heading-icon{font-family:"Segoe UI Emoji","Segoe UI Symbol",Arial,sans-serif;font-size:21px;vertical-align:middle}.heart{color:#ee99ba}.arousal-meter{width:190px;max-width:100%;padding-top:26px}.arousal-meter .fill{background:linear-gradient(#f2b2ca,#cb6f96)}.arousal-meter .bar{border-color:#b18391}th[hidden]{display:none}@media(max-width:760px){.arousal-meter{width:155px}}
</style></head><body><main class="panel" aria-labelledby="title"><header><div><h1 id="title">Milk Maids</h1><p>Milk reserves and fullness</p></div><div class="actions"><button id="refresh" class="icon-button" aria-label="Refresh" disabled>↻</button><button id="close" class="icon-button" aria-label="Close">×</button></div></header><div class="scroll"><table><thead><tr><th>Milk Maid</th><th><span class="heading-icon" aria-hidden="true">&#129371;</span> Milk Capacity</th><th id="arousal-heading" hidden><span class="heading-icon heart" aria-hidden="true">&#9829;</span> Arousal</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" role="status">Loading Milk Maids…</div></div><footer><span id="count">Waiting for roster</span><span id="notice" role="status">Choose an action to close this panel and begin.</span></footer></main><div id="tooltip" class="tooltip" role="tooltip" hidden></div>
<script>
(function(){
'use strict';
let session = '';
const rows=document.getElementById('rows'),empty=document.getElementById('empty'),count=document.getElementById('count'),notice=document.getElementById('notice'),refresh=document.getElementById('refresh');
const tooltip=document.getElementById('tooltip');
function hideTooltip(){tooltip.hidden=true;tooltip.textContent='';}
function explain(node,text){
 node.setAttribute('aria-describedby','tooltip');
 function show(){tooltip.textContent=text;tooltip.hidden=false;}
 node.addEventListener('mouseenter',show);node.addEventListener('mouseleave',hideTooltip);
 node.addEventListener('focus',show);node.addEventListener('blur',hideTooltip);
}
explain(refresh,'Refresh milk amounts, fullness and available arousal values. Values update when you open this roster or refresh it.');
explain(document.getElementById('close'),'Close the roster and return to the game. Escape or your roster hotkey also closes it.');
function cell(tag,text){const node=document.createElement(tag);node.textContent=text;return node;}
function number(value){return typeof value==='number'&&Number.isFinite(value)?value:null;}
function formatted(value){return number(value)===null?'N/A':value.toFixed(1);}
function post(name,payload){hideTooltip();if(typeof window[name]!=='function'){notice.textContent='Controls are not ready yet.';return false;}try{window[name](payload===undefined?session:payload);return true;}catch(error){notice.textContent='Unable to reach the roster controls.';return false;}}
window.setRoster=function(payload){
 try {
  const data=typeof payload==='string'?JSON.parse(payload):payload;
  if(!data||!Array.isArray(data.rows)||typeof data.session!=='string')throw new Error('Invalid roster');
  hideTooltip();session=data.session;rows.textContent='';
  const showArousal=data.arousalAvailable===1||data.arousalAvailable===true;document.getElementById('arousal-heading').hidden=!showArousal;
  data.rows.forEach(function(maid){
   const row=document.createElement('tr'),name=cell('td',typeof maid.name==='string'?maid.name:'Unnamed Milk Maid');
   if(maid.status)name.appendChild(cell('small',String(maid.status)));
   row.appendChild(name);const fullness=document.createElement('td'),meter=document.createElement('div'),amount=cell('div',formatted(maid.milk)+' / '+formatted(maid.capacity)),wrap=document.createElement('div');meter.className='milk-meter';amount.className='amount';meter.appendChild(amount);wrap.className='fullness';
   const percent=number(maid.percent);wrap.appendChild(cell('span',percent===null?'N/A':percent.toFixed(1)+'%'));wrap.firstChild.className='percent';
   const bar=document.createElement('div'),fill=document.createElement('span');bar.className='bar';fill.className='fill';fill.style.width=(percent===null?0:Math.max(0,Math.min(100,percent)))+'%';bar.setAttribute('aria-hidden','true');bar.appendChild(fill);wrap.appendChild(bar);meter.appendChild(wrap);fullness.appendChild(meter);row.appendChild(fullness);
   if(showArousal){
    const arousalCell=document.createElement('td'),arousalMeter=document.createElement('div'),arousalWrap=document.createElement('div'),arousalBar=document.createElement('div'),arousalFill=document.createElement('span');
    const rawArousal=number(maid.arousal),arousal=rawArousal===null||rawArousal<0?null:Math.min(100,rawArousal);
    arousalMeter.className='arousal-meter';arousalWrap.className='fullness';const label=cell('span',arousal===null?'N/A':arousal.toFixed(1)+'%');label.className='percent';arousalWrap.appendChild(label);
    arousalBar.className='bar';arousalFill.className='fill';arousalFill.style.width=(arousal===null?0:arousal)+'%';arousalBar.setAttribute('aria-hidden','true');arousalBar.appendChild(arousalFill);arousalWrap.appendChild(arousalBar);arousalMeter.appendChild(arousalWrap);arousalCell.appendChild(arousalMeter);row.appendChild(arousalCell);
   }
   const actionCell=document.createElement('td'),action=document.createElement('div');action.className='actions';actionCell.appendChild(action);
   function actionButton(label,kind,blocked){
    const slot=document.createElement('span'),button=cell('button',kind==='self'?'🐮':'🥛');slot.className='action-slot';button.className='icon-button';button.setAttribute('aria-label',label);
    button.disabled=blocked||typeof maid.token!=='string';
    let description=kind==='self'?'Self Milk: start self-milking.':label+': use milk from the player inventory. Lactacid is preferred only for confirmed Milk Maids. If no eligible milk is owned, the Free Jug cheat can supply ordinary milk.';
    if(button.disabled){description+=' Unavailable: '+(kind==='self'&&maid.selfReason?maid.selfReason:'target or roster entry is unavailable')+'.';slot.setAttribute('tabindex','0');slot.setAttribute('role','group');slot.setAttribute('aria-label',label+' unavailable');}
    explain(slot,description);explain(button,description);
    button.addEventListener('click',function(){if(button.disabled)return;const sent=post('mmeRosterAction',session+'|'+maid.token+'|'+kind);if(sent){for(const child of action.children)child.firstChild.disabled=true;}});
    slot.appendChild(button);action.appendChild(slot);
   }
   const available=maid.available===1||maid.available===true;const player=maid.player===1||maid.player===true;
   actionButton(player?'Drink':'Give Milk','drink',!available);actionButton('Self Milk','self',!available||maid.selfReason!=='');row.appendChild(actionCell);rows.appendChild(row);
  });
  empty.hidden=data.rows.length>0;empty.textContent=data.message||'No registered Milk Maids.';count.textContent=data.rows.length+' Milk Maid'+(data.rows.length===1?'':'s');notice.textContent=data.message||'Choose an action to close this panel and begin.';refresh.disabled=false;
 }catch(error){notice.textContent='Unable to display the roster. Try Refresh.';refresh.disabled=false;if(typeof window.mmeRosterError==='function')window.mmeRosterError(String(error&&error.message||error).slice(0,220)+' | payload='+String(payload).slice(0,340));}
};
refresh.addEventListener('click',function(){post('mmeRosterRefresh');});
document.getElementById('close').addEventListener('click',function(){post('mmeRosterClose');});
document.addEventListener('keydown',function(event){if(event.key==='Escape'&&post('mmeRosterClose')){event.preventDefault();}});
})();
</script></body></html>
